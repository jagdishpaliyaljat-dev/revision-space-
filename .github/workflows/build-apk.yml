name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" > /dev/null 2>&1 || true
          else
            echo "sdkmanager not found, relying on AGP auto-download"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Prepare .env from example
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi

      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 secret is missing. A random keystore would change the app signature and break in-place updates (and wipe data). Refusing to build."
            exit 1
          fi
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > debug.keystore
          echo "Using the stable debug keystore from repository secret (in-place updates supported)."

      - name: Print debug signing certificate info
        run: |
          echo "=== DEBUG_SHA1_BEGIN ==="
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            | grep 'SHA1:' | head -1
          echo "=== DEBUG_SHA1_END ==="

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: revision-space-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore


  backup-tests:
    name: Unit tests (backup format)
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          else
            echo "sdkmanager not found, relying on AGP auto-download"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Prepare .env from example
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi

      - name: Run backup + alarm policy unit tests
        run: gradle :app:testDebugUnitTest --tests "com.example.data.backup.*" --tests "com.example.data.local.*" --tests "com.example.data.syllabus.*" --tests "com.example.data.chat.*" --tests "com.example.services.*" --stacktrace --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: backup-unit-test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore
